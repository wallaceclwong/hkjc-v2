name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: hkjc-v2
  SERVICE_NAME: hkjc-predictor
  REGION: us-central1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Container
        id: build
        run: |-
          BUILD_ID=$(gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} --async --format="value(id)" .)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for Build
        run: |-
          while true; do
            STATUS=$(gcloud builds describe ${{ steps.build.outputs.build_id }} --format="value(status)")
            echo "Current Build Status: $STATUS"
            if [ "$STATUS" == "SUCCESS" ]; then
              break
            elif [ "$STATUS" == "FAILURE" ] || [ "$STATUS" == "INTERNAL_ERROR" ] || [ "$STATUS" == "TIMEOUT" ] || [ "$STATUS" == "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 20
          done

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |-
            GCP_LOCATION=${{ env.REGION }}
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            FIRESTORE_DATABASE=(default)
            USE_FIRESTORE=true
          flags: --allow-unauthenticated

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: hkjc-v2
          channelId: live
